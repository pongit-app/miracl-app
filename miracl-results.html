<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>miracl杯 結果・順位</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="miracl杯">
<style>
:root{--ink:#1a2332;--line:#d3dbe8;--head:#2b3a67;--accent:#e8407a;--rest:#9aa6bd;--bg:#f4f6fb;--gold:#f6c945;}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:20px}
.wrap{max-width:760px;margin:0 auto}
.title{text-align:center;margin:0 0 2px;font-size:32px;letter-spacing:2px;color:var(--head)}
.title b{color:var(--accent)}
.sub{text-align:center;color:var(--rest);margin:0 0 16px;font-size:13px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 18px;font-size:15px;font-weight:700;cursor:pointer;color:var(--rest)}
.tab.on{color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px;margin-bottom:18px;box-shadow:0 2px 10px rgba(40,60,110,.05)}
h2{font-size:16px;margin:0 0 12px;padding-left:10px;border-left:5px solid var(--accent);color:var(--head)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 5px;text-align:center}
thead th{background:var(--head);color:#fff;font-weight:600;font-size:12.5px}
.rank{font-weight:800;font-size:15px;width:38px}
.r1{background:#fff7df}.r2{background:#f1f4f9}.r3{background:#fbeee2}
.medal{font-size:15px}
.tname{font-weight:700;text-align:left;padding-left:10px}
.small{color:var(--rest);font-size:12px}
.pos{color:#1f9d57;font-weight:700}.neg{color:#d33;font-weight:700}
.mt-list table{font-size:13px}
.mt-list .vs{color:var(--rest);font-size:11px}
.mt-list input{width:42px;text-align:center;font-size:15px;padding:5px 2px;border:1px solid var(--line);border-radius:6px}
.mt-list input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.mt-list .ta{text-align:right;padding-right:8px;font-weight:600}
.mt-list .tb{text-align:left;padding-left:8px;font-weight:600}
.setlbl{font-size:11px;color:var(--rest)}
.done{background:#f3fbf5}
.bar{text-align:center;margin-bottom:14px}
.bar button{background:var(--head);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;margin:3px 4px}
.note{font-size:12px;color:var(--rest);margin-top:8px;line-height:1.7}
@page{size:A4 portrait;margin:0} /* 余白0でブラウザのURL/日付印字を消す */
@media print{body{background:#fff;padding:12mm}.noprint{display:none}.card{box-shadow:none;page-break-inside:avoid}}
</style></head><body><div class="wrap">
<h1 class="title"><b>miracl</b>杯 <span style="font-size:20px">結果・順位</span></h1>
<p class="sub">2セット制 ／ 順位は「① 獲得セット数 → ② 得失点差」で自動計算 ／ チーム数は進行表アプリの設定に連動</p>
<div class="tabs" id="tabs"></div>
<div class="bar noprint">
  <button onclick="window.print()">🖨 順位表を印刷/PDF</button>
  <button onclick="exportData()">💾 データ保存</button>
  <button onclick="document.getElementById('imp').click()">📂 データ読込</button>
  <input id="imp" type="file" accept=".json,application/json" style="display:none">
  <button onclick="clearLeague()">このリーグの結果をクリア</button>
</div>
<details class="card noprint" id="namepanel">
  <summary style="cursor:pointer;font-weight:700;color:var(--head);font-size:15px">✏️ チーム名を入力（クリックで開閉／進行表アプリと共有）</summary>
  <div id="namegrid" style="display:flex;gap:20px;flex-wrap:wrap;margin-top:14px"></div>
</details>
<div id="stand"></div>
<div id="matches"></div>
<p class="note">※各試合とも「1セット目」「2セット目」の両チームの得点を入力してください。両チームに値が入ったセットだけ集計します。<br>
※チーム数・チーム名は進行表アプリ（miracl-cup.html）の設定と共有。結果はこの端末に自動保存されます。</p>
</div>
<script>
const CK='miracl_config_v1', NK='miracl_names_v2', RK='miracl_results_v2';
let cfg={w:8,m1:7,m2:7,start:'09:00',dur:25};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CK))||{})}catch(e){}
const LEAGUES=[
 {key:'w', name:'女子',   color:'#e8407a'},
 {key:'m1',name:'混合①', color:'#2f6fe0'},
 {key:'m2',name:'混合②', color:'#1f9d57'},
];
const size=lg=>({w:cfg.w,m1:cfg.m1,m2:cfg.m2})[lg];
let names={}, results={}, cur='w';
try{names=JSON.parse(localStorage.getItem(NK))||{}}catch(e){}
try{results=JSON.parse(localStorage.getItem(RK))||{}}catch(e){}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nm=(lg,t)=>names[lg+':'+t]||(''+t);
function roundRobin(n){
  if(n<2)return [];
  const arr=[];for(let i=1;i<=n;i++)arr.push(i);
  if(n%2)arr.push(0);
  const m=arr.length,rounds=[];let a=arr.slice();
  for(let r=0;r<m-1;r++){
    const rd=[];
    for(let i=0;i<m/2;i++){const x=a[i],y=a[m-1-i];if(x&&y)rd.push([x,y]);}
    rounds.push(rd);a=[a[0],a[m-1]].concat(a.slice(1,m-1));
  }
  return rounds;
}
const pairsOf=lg=>roundRobin(size(lg)).flat();
const rkey=(lg,p)=>lg+':'+Math.min(p[0],p[1])+'-'+Math.max(p[0],p[1]);

function calc(lg){
  const n=size(lg); const st={};
  for(let t=1;t<=n;t++)st[t]={t,g:0,w:0,d:0,l:0,sw:0,sl:0,pf:0,pa:0};
  pairsOf(lg).forEach(pr=>{
    const r=results[rkey(lg,pr)];if(!r)return;
    const [a,b]=pr;let sA=0,sB=0,played=false;
    [[r.s1a,r.s1b],[r.s2a,r.s2b]].forEach(([x,y])=>{
      if(x===''||y===''||x==null||y==null)return;
      x=+x;y=+y;played=true;
      st[a].pf+=x;st[a].pa+=y;st[b].pf+=y;st[b].pa+=x;
      if(x>y){st[a].sw++;st[b].sl++;sA++;}
      else if(y>x){st[b].sw++;st[a].sl++;sB++;}
    });
    if(!played)return;
    st[a].g++;st[b].g++;
    if(sA>sB){st[a].w++;st[b].l++;}
    else if(sB>sA){st[b].w++;st[a].l++;}
    else{st[a].d++;st[b].d++;}
  });
  const arr=Object.values(st);
  arr.sort((x,y)=>(y.sw-x.sw)||((y.pf-y.pa)-(x.pf-x.pa))||(y.pf-x.pf)||(x.t-y.t));
  let rank=1;
  arr.forEach((row,idx)=>{
    if(idx>0){
      const p=arr[idx-1];
      const same=(p.sw===row.sw)&&((p.pf-p.pa)===(row.pf-row.pa));
      rank=same?p._rank:idx+1;
    }
    row._rank=rank;
  });
  return arr;
}
function renderStand(){
  const L=LEAGUES.find(l=>l.key===cur);const arr=calc(cur);
  const medal=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':'';
  let rows='';
  arr.forEach(row=>{
    const d=row.pf-row.pa;
    const dc=d>0?'pos':(d<0?'neg':'');
    const cls=row._rank===1?'r1':row._rank===2?'r2':row._rank===3?'r3':'';
    rows+=`<tr class="${cls}">
      <td class="rank"><span class="medal">${medal(row._rank)}</span>${row._rank}</td>
      <td class="tname">${esc(nm(cur,row.t))}</td>
      <td>${row.g}</td><td class="small">${row.w}-${row.d}-${row.l}</td>
      <td style="font-weight:700">${row.sw}</td>
      <td>${row.pf}</td><td>${row.pa}</td>
      <td class="${dc}">${d>0?'+':''}${d}</td></tr>`;
  });
  document.getElementById('stand').innerHTML=`<div class="card"><h2 style="border-color:${L.color}">${L.name} 順位表（${size(cur)}チーム）</h2>
    <table><thead><tr><th>順位</th><th>チーム</th><th>試合</th><th>勝分敗</th><th>獲得<br>セット</th><th>得点</th><th>失点</th><th>得失差</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="note">並び順：獲得セット数の多い順 → 同じなら得失点差の大きい順（さらに同じなら得点→チーム番号）。🥇🥈🥉は現時点の上位3。</p></div>`;
}
function renderMatches(){
  const L=LEAGUES.find(l=>l.key===cur);const prs=pairsOf(cur);
  let rows='';
  prs.forEach((pr,i)=>{
    const [a,b]=pr;const key=rkey(cur,pr);const r=results[key]||{};
    const v=f=>(r[f]!=null?r[f]:'');
    const filled=['s1a','s1b','s2a','s2b'].every(f=>v(f)!=='');
    rows+=`<tr class="mrow ${filled?'done':''}">
      <td class="small">${i+1}</td>
      <td class="ta">${esc(nm(cur,a))}</td>
      <td><span class="setlbl">1st</span><br><input inputmode="numeric" data-k="${key}" data-f="s1a" value="${v('s1a')}"> <span class="vs">-</span> <input inputmode="numeric" data-k="${key}" data-f="s1b" value="${v('s1b')}"></td>
      <td><span class="setlbl">2nd</span><br><input inputmode="numeric" data-k="${key}" data-f="s2a" value="${v('s2a')}"> <span class="vs">-</span> <input inputmode="numeric" data-k="${key}" data-f="s2b" value="${v('s2b')}"></td>
      <td class="tb">${esc(nm(cur,b))}</td></tr>`;
  });
  document.getElementById('matches').innerHTML=`<div class="card mt-list"><h2 style="border-color:${L.color}">${L.name} 試合結果入力（全${prs.length}試合）</h2>
    <table><thead><tr><th>試合</th><th>チーム</th><th>1セット目</th><th>2セット目</th><th>チーム</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  document.querySelectorAll('#matches input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const key=inp.dataset.k,f=inp.dataset.f;
      results[key]=results[key]||{};
      results[key][f]=inp.value.replace(/[^0-9]/g,'');
      inp.value=results[key][f];
      localStorage.setItem(RK,JSON.stringify(results));
      const row=inp.closest('tr');
      const done=['s1a','s1b','s2a','s2b'].every(x=>(results[key][x]||'')!=='');
      row.classList.toggle('done',done);
      renderStand();
    });
  });
}
function renderNamePanel(){
  document.getElementById('namegrid').innerHTML=LEAGUES.map(L=>{
    const n=size(L.key);if(n<2)return '';
    let inputs='';
    for(let t=1;t<=n;t++){
      const v=esc(names[L.key+':'+t]||'');
      inputs+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <span style="width:18px;text-align:right;color:${L.color};font-weight:700">${t}</span>
        <input data-lg="${L.key}" data-t="${t}" value="${v}" placeholder="チーム${t}"
        style="width:140px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:13px"></div>`;
    }
    return `<div><div style="font-weight:700;color:${L.color};margin-bottom:8px;border-bottom:2px solid ${L.color};padding-bottom:3px">${L.name}</div>${inputs}</div>`;
  }).join('');
  document.querySelectorAll('#namegrid input').forEach(inp=>inp.addEventListener('input',()=>{
    const key=inp.dataset.lg+':'+inp.dataset.t,val=inp.value.trim();
    if(val)names[key]=val;else delete names[key];
    localStorage.setItem(NK,JSON.stringify(names));
    renderStand();renderMatches();
  }));
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=LEAGUES.filter(l=>size(l.key)>=2).map(l=>
    `<button class="tab ${l.key===cur?'on':''}" style="${l.key===cur?'background:'+l.color+';border-color:'+l.color:''}" onclick="setCur('${l.key}')">${l.name}（${size(l.key)}）</button>`).join('');
}
function setCur(k2){cur=k2;renderAll();}
function clearLeague(){
  const L=LEAGUES.find(l=>l.key===cur);
  if(!confirm(L.name+'の入力結果を全部消します。よろしいですか？'))return;
  pairsOf(cur).forEach(pr=>delete results[rkey(cur,pr)]);
  localStorage.setItem(RK,JSON.stringify(results));renderAll();
}
function exportData(){
  const data={config:cfg,names:JSON.parse(localStorage.getItem(NK)||'{}'),
    results:JSON.parse(localStorage.getItem(RK)||'{}')};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='miracl杯-データ.json';a.click();URL.revokeObjectURL(a.href);
}
document.getElementById('imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(d.config)localStorage.setItem(CK,JSON.stringify(d.config));
    if(d.names)localStorage.setItem(NK,JSON.stringify(d.names));
    if(d.results)localStorage.setItem(RK,JSON.stringify(d.results));
    alert('読み込みました');location.reload();
  }catch(err){alert('このファイルは読み込めませんでした');}};rd.readAsText(f);
});
function renderAll(){renderTabs();renderNamePanel();renderStand();renderMatches();}
renderAll();
</script></body></html>
